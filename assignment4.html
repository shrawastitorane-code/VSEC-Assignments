<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Canvas Studio</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #controls {
            margin-bottom: 15px;
            z-index: 10;
        }

        .btn {
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2563eb;
        }

        #fileInput {
            display: none;
        }

        #canvasContainer {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #111;
            border: 2px solid #333;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* The trail effect canvas stays in the background */
        #effectCanvas {
            z-index: 1;
            pointer-events: none; 
        }

        /* The interactive image element */
        #uploadedImage {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            max-width: 80%;
            max-height: 80%;
            cursor: zoom-in;
            user-select: none;
            transition: transform 0.2s ease-out;
            z-index: 2;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

    <div id="controls">
        <label for="fileInput" class="btn">Add Image</label>
        <input type="file" id="fileInput" accept="image/*">
    </div>

    <div id="canvasContainer" id="interactiveZone">
        <!-- Interactive background effect canvas -->
        <canvas id="effectCanvas"></canvas>
        <!-- Zoomable foreground image -->
        <img id="uploadedImage" alt="Uploaded Content">
    </div>

    <script>
        // --- Element Selectors ---
        const fileInput = document.getElementById('fileInput');
        const uploadedImage = document.getElementById('uploadedImage');
        const container = document.getElementById('canvasContainer');
        const canvas = document.getElementById('effectCanvas');
        const ctx = canvas.getContext('2d');

        // --- State Variables ---
        let isZoomed = false;
        let particles = [];
        let isDrawing = false;

        // --- Resize Canvas to Match Container ---
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();

        // --- Image Upload Logic ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    uploadedImage.src = event.target.result;
                    uploadedImage.style.display = 'block';
                    // Reset zoom state on new image load
                    isZoomed = false;
                    uploadedImage.style.transform = 'translate(-50%, -50%) scale(1)';
                    uploadedImage.style.cursor = 'zoom-in';
                }
                reader.readAsDataURL(file);
            }
        });

        // --- Image Zoom Logic ---
        uploadedImage.addEventListener('click', function(e) {
            e.stopPropagation(); // Prevents triggering background effects
            if (!isZoomed) {
                uploadedImage.style.transform = 'translate(-50%, -50%) scale(2.5)';
                uploadedImage.style.cursor = 'zoom-out';
                isZoomed = true;
            } else {
                uploadedImage.style.transform = 'translate(-50%, -50%) scale(1)';
                uploadedImage.style.cursor = 'zoom-in';
                isZoomed = false;
            }
        });

        // --- Mouse Particle Effect Logic ---
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 15 + 5;
                this.speedX = Math.random() * 3 - 1.5;
                this.speedY = Math.random() * 3 - 1.5;
                // Generates bright neon colors
                this.color = `hsl(${Math.random() * 360}, 100%, 60%)`;
                this.alpha = 1;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.size > 0.2) this.size -= 0.1;
                this.alpha -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Mouse Event Listeners for Effects ---
        container.addEventListener('mousedown', () => isDrawing = true);
        window.addEventListener('mouseup', () => isDrawing = false);

        container.addEventListener('mousemove', function(e) {
            if (!isDrawing) return;
            
            // Get correct mouse coordinates relative to the canvas bounding box
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Create multiple particles per movement step for a dense trail
            for (let i = 0; i < 3; i++) {
                particles.push(new Particle(x, y));
            }
        });

        // --- Animation Loop ---
        function animate() {
            // Slight motion blur tracking effect by semi-clearing background
            ctx.fillStyle = 'rgba(17, 17, 17, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                // Remove dead particles
                if (particles[i].alpha <= 0 || particles[i].size <= 0.2) {
                    particles.splice(i, 1);
                    i--;
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>

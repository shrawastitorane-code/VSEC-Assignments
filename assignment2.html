<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { max-width: 900px; width: 100%; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; font-weight: 700; }
        
        /* Dashboard Cards */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #4a5568; font-size: 0.9rem; }
        input { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; transition: border 0.2s; }
        input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .marks-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        button { width: 100%; padding: 12px; background: #4f46e5; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
        button:hover { background: #4338ca; }
        
        /* Topper Box Styling */
        .topper-box { display: flex; flex-direction: column; justify-content: center; align-items: center; background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; text-align: center; }
        .topper-badge { font-size: 3rem; margin-bottom: 10px; animation: bounce 2s infinite; }
        .topper-name { font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .topper-score { font-size: 1.1rem; opacity: 0.9; }
        .no-topper { font-style: italic; opacity: 0.8; }
        
        /* Table Styling */
        .table-container { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.95rem; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; padding: 16px; border-bottom: 2px solid #e2e8f0; }
        td { padding: 16px; border-bottom: 1px solid #e2e8f0; color: #334155; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f8fafc; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Performance Tracker</h1>
    
    <div class="dashboard-grid">
        <!-- Input Form Card -->
        <div class="card">
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Student Name</label>
                    <input type="text" id="studentName" placeholder="Enter name" required>
                </div>
                <div class="form-group">
                    <label>Marks Obtains (Out of 100 each)</label>
                    <div class="marks-row">
                        <div>
                            <label style="font-size:0.75rem; color:#64748b;">Subject 1</label>
                            <input type="number" id="sub1" min="0" max="100" required>
                        </div>
                        <div>
                            <label style="font-size:0.75rem; color:#64748b;">Subject 2</label>
                            <input type="number" id="sub2" min="0" max="100" required>
                        </div>
                        <div>
                            <label style="font-size:0.75rem; color:#64748b;">Subject 3</label>
                            <input type="number" id="sub3" min="0" max="100" required>
                        </div>
                    </div>
                </div>
                <button type="submit">Add Student Data</button>
            </form>
        </div>
        
        <!-- Live Topper Status Card -->
        <div class="card topper-box" id="topperCard">
            <div class="topper-badge">👑</div>
            <div id="topperDisplay">
                <p class="no-topper">No student records added yet.</p>
            </div>
        </div>
    </div>

    <!-- Live Performance Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Student Name</th>
                    <th>Total Marks (300)</th>
                    <th>Percentage (%)</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- JavaScript inserts rows dynamically here -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // Array to temporarily hold student objects in memory
    const studentsList = [];

    document.getElementById('studentForm').addEventListener('submit', function(event) {
        // Prevent the page from executing a hard reload upon form submission
        event.preventDefault();
        
        // Extract inputs from the DOM
        const name = document.getElementById('studentName').value.trim();
        const m1 = parseFloat(document.getElementById('sub1').value);
        const m2 = parseFloat(document.getElementById('sub2').value);
        const m3 = parseFloat(document.getElementById('sub3').value);
        
        // Calculate performance matrix metrics
        const totalMarks = m1 + m2 + m3;
        const percentage = (totalMarks / 300) * 100;
        
        // Construct the new student object structure
        const newStudent = {
            name: name,
            total: totalMarks,
            // Format percentage metric to 2 decimal spaces safely
            percent: parseFloat(percentage.toFixed(2))
        };
        
        // Push record object to tracker array
        studentsList.push(newStudent);
        
        // Update DOM elements layout seamlessly
        appendRowToTable(newStudent);
        findAndDisplayTopper();
        
        // Flush structural input elements to leave it blank for the next entry
        document.getElementById('studentForm').reset();
        document.getElementById('studentName').focus();
    });

    // Strategy implementation for live structural data mutations within DOM
    function appendRowToTable(student) {
        const tbody = document.getElementById('studentTableBody');
        const row = document.createElement('tr');
        
        row.innerHTML = `
            <td><strong>${student.name}</strong></td>
            <td>${student.total}</td>
            <td><strong>${student.percent}%</strong></td>
        `;
        
        tbody.appendChild(row);
    }

    // Logic parsing for updating current tracking topper stats
    function findAndDisplayTopper() {
        if (studentsList.length === 0) return;
        
        let topper = studentsList[0];
        
        // Loop array tracking logic to check for the highest calculated cumulative percentage 
        for (let i = 1; i < studentsList.length; i++) {
            if (studentsList[i].percent > topper.percent) {
                topper = studentsList[i];
            }
        }
        
        // Update dashboard widget markup instantly
        const topperDisplay = document.getElementById('topperDisplay');
        topperDisplay.innerHTML = `
            <div class="topper-name">${topper.name}</div>
            <div class="topper-score">Current Topper: ${topper.percent}% (${topper.total} / 300)</div>
        `;
    }
</script>

</body>
</html>
